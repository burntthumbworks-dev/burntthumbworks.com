<head>

  <meta property="og:title" content="GrimmKart.io — Grimm Folklore Kart Racer & Battle Arena" />
  <meta property="og:description" content="Free browser kart game by Burnt Thumb Works — Race Mode + Battle Arena Mode, built on public-domain Grimm fairy tales." />
  <meta property="og:url" content="https://burntthumbworks.com/games/grimmkart/play/" />
  <meta property="og:site_name" content="Burnt Thumb Works" />
  <style>
    #btw-site-menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);
      left:calc(env(safe-area-inset-left,0px) + 10px);z-index:50;
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .btw-pill{display:inline-flex;align-items:center;gap:6px;height:38px;min-width:38px;
      padding:0 12px;border-radius:999px;border:1px solid rgba(216,180,106,.5);
      background:rgba(11,10,15,.76);color:#e9dcc0;font-size:12.5px;font-weight:600;text-decoration:none;
      cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
      box-shadow:0 4px 14px rgba(0,0,0,.45);}
    .btw-pill:hover{border-color:#f59e2e;color:#ffb84d;text-decoration:none;}
    .btw-pill:active{transform:translateY(1px);}
    #btw-site-panel{position:absolute;top:46px;left:0;width:220px;background:rgba(17,14,28,.98);
      border:1px solid rgba(216,180,106,.45);border-radius:14px;padding:8px;
      box-shadow:0 14px 38px rgba(0,0,0,.65);}
    #btw-site-panel[hidden]{display:none;}
    #btw-site-panel a,#btw-site-panel button{display:block;width:100%;box-sizing:border-box;
      text-align:left;text-decoration:none;font:inherit;font-size:14.5px;color:#efe9f5;
      background:transparent;border:0;border-radius:9px;padding:11px 12px;min-height:44px;cursor:pointer;}
    #btw-site-panel a:hover,#btw-site-panel button:hover{background:rgba(216,180,106,.16);color:#ffb84d;}
    #btw-site-panel .sub{font-size:11.5px;color:#b6abca;line-height:1.35;}
  </style>
  <script type="module" crossorigin src="./assets/index-ftQnNeZm.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three-DFbADBYy.js">
  <link rel="stylesheet" crossorigin href="./assets/index-Bo5q0fZ9.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>

  <nav id="btw-site-menu" aria-label="Site navigation">
    <a class="btw-pill" href="/games/grimmkart/" aria-label="Exit game to GrimmKart page">← Exit</a>
    <button class="btw-pill" id="btw-site-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="btw-site-panel">☰ Site</button>
    <div id="btw-site-panel" hidden>
      <button type="button" data-site="resume">▶ Resume game</button>
      <a href="/games/grimmkart/">← GrimmKart Overview</a>
      <a href="/games/">🎮 All Games</a>
      <a href="/apps.html">📱 All Apps</a>
      <a href="/">⌂ Burnt Thumb Works Home</a>
      <span class="sub" style="display:block;padding:6px 12px 4px;">In-game pause is at the top center (⏸) during a race or battle.</span>
    </div>
  </nav>
  <script>
    (function () {
      "use strict";
      var t = document.getElementById("btw-site-toggle");
      var p = document.getElementById("btw-site-panel");
      if (!t || !p) return;
      function open() { p.hidden = false; t.setAttribute("aria-expanded", "true"); }
      function close() { p.hidden = true; t.setAttribute("aria-expanded", "false"); }
      t.addEventListener("click", function (e) { e.stopPropagation(); if (p.hidden) open(); else close(); });
      p.addEventListener("click", function (e) {
        if (e.target && e.target.getAttribute("data-site") === "resume") { close(); }
      });
      document.addEventListener("click", function (e) {
        if (!p.hidden && !p.contains(e.target) && !t.contains(e.target)) close();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !p.hidden) close();
      });
    })();
  </script>
</body>
</html>
